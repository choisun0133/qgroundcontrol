name: AeroResearch GCS Release

on:
  push:
    branches:
      - 'publish-aero'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: aerogcs-1.4.0
    steps:
      - name: Download build artifacts (only builds of the current aero-gcs head)
        run: |
          set -euo pipefail
          mkdir -p dl out
          head=$(gh api "repos/$REPO/commits/aero-gcs" -q .sha)
          echo "aero-gcs head: $head"
          fetch() {  # workflow, artifact, dir
            # The run may still be going (other matrix legs); the artifact is enough
            run=$(gh run list -R "$REPO" -b aero-gcs -w "$1" -L 5 --json databaseId,headSha -q "[.[] | select(.headSha==\"$head\")][0].databaseId")
            if [ -n "$run" ] && gh run download "$run" -R "$REPO" -n "$2" -D "$3"; then
              echo "$1: run $run"
            else
              echo "$1: no artifact for $head yet - skipped"
            fi
          }
          fetch Windows QGroundControl-installer-AMD64 dl/win
          fetch Android QGroundControl-linux dl/android
          fetch MacOS QGroundControl dl/mac
          find dl -type f -exec ls -l {} \;

      - name: Rename files
        run: |
          set -euo pipefail
          win=$(find dl -path 'dl/win/*' -iname '*.exe' | head -1)
          [ -n "$win" ] && cp "$win" "out/AeroResearchGCS-1.4.0-Windows-x64-Setup.exe"
          apk=$(find dl -path 'dl/android/*' -iname '*.apk' | head -1)
          [ -n "$apk" ] && cp "$apk" "out/AeroResearchGCS-1.4.0-Android.apk"
          dmg=$(find dl -path 'dl/mac/*' -iname '*.dmg' | head -1)
          [ -n "$dmg" ] && cp "$dmg" "out/AeroResearchGCS-1.4.0-macOS.dmg"
          ls -l out
          [ -n "$(ls out)" ]

      - name: Publish release
        run: |
          set -euo pipefail
          gh release delete "$TAG" -R "$REPO" -y --cleanup-tag || true
          gh release create "$TAG" -R "$REPO" --target "${{ github.sha }}" \
            --title "AeroResearch GCS 1.4.0" \
            --notes "AeroResearch GCS 설치 파일 (Windows / Android / macOS). 로그인 없이 아래 Assets에서 바로 받을 수 있습니다." \
            out/*
