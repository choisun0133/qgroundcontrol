name: AeroResearch GCS Release

on:
  push:
    branches:
      - 'publish-aero'
  workflow_dispatch:   # GitHub currently skips push-triggered runs on this fork; run it by hand
    inputs:
      variant:
        description: 'Release variant: normal, or FFmpeg (Windows build made with video_player=FFmpeg)'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - FFmpeg

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ inputs.variant == 'FFmpeg' && 'aerogcs-1.6.7-ffmpeg' || 'aerogcs-1.6.7' }}
      SUFFIX: ${{ inputs.variant == 'FFmpeg' && '-FFmpeg' || '' }}
      TITLE: ${{ inputs.variant == 'FFmpeg' && 'AeroResearch GCS 1.6.7 (FFmpeg 영상 시험판)' || 'AeroResearch GCS 1.6.7' }}
    steps:
      - name: Download build artifacts (only builds of the current aero-gcs head)
        run: |
          set -euo pipefail
          mkdir -p dl out
          head=$(gh api "repos/$REPO/commits/aero-gcs" -q .sha)
          echo "aero-gcs head: $head"
          fetch() {  # workflow, artifact, dir
            # The run may still be going (other matrix legs); the artifact is enough
            # Normal builds come from pushes; the FFmpeg test build is a manual (workflow_dispatch) run
            ev=$([ -n "$SUFFIX" ] && echo workflow_dispatch || echo push)
            run=$(gh run list -R "$REPO" -c "$head" -w "$1" -L 10 --json databaseId,headSha,event -q "[.[] | select(.headSha==\"$head\" and .event==\"$ev\")][0].databaseId")
            if [ -n "$run" ] && gh run download "$run" -R "$REPO" -n "$2" -D "$3"; then
              echo "$1: run $run"
            else
              echo "$1: no artifact for $head yet - skipped"
            fi
          }
          fetch Windows QGroundControl-installer-AMD64 dl/win
          fetch Windows QGroundControl-installer-AMD64-User dl/winuser
          if [ -z "$SUFFIX" ]; then
            fetch Android QGroundControl-linux dl/android
            fetch MacOS QGroundControl dl/mac
          fi
          find dl -type f -exec ls -l {} \;

      - name: Rename files
        run: |
          set -euo pipefail
          # Developer edition: full vehicle setup / parameters. User edition: operators, no parameter editing
          win=$(find dl -path 'dl/win/*' -iname '*.exe' | head -1)
          winuser=$(find dl -path 'dl/winuser/*' -iname '*.exe' | head -1)
          if [ -n "$win" ]; then
            if [ -n "$winuser" ]; then
              cp "$win" "out/AeroResearchGCS-1.6.7-Windows-x64${SUFFIX}-Developer-Setup.exe"
            else
              cp "$win" "out/AeroResearchGCS-1.6.7-Windows-x64${SUFFIX}-Setup.exe"
            fi
          fi
          [ -n "$winuser" ] && cp "$winuser" "out/AeroResearchGCS-1.6.7-Windows-x64${SUFFIX}-User-Setup.exe"
          apk=$(find dl -path 'dl/android/*' -iname '*.apk' | head -1)
          [ -n "$apk" ] && cp "$apk" "out/AeroResearchGCS-1.6.7-Android.apk"
          dmg=$(find dl -path 'dl/mac/*' -iname '*.dmg' | head -1)
          [ -n "$dmg" ] && cp "$dmg" "out/AeroResearchGCS-1.6.7-macOS.dmg"
          ls -l out
          [ -n "$(ls out)" ]

      - name: Publish release
        run: |
          set -euo pipefail
          gh release delete "$TAG" -R "$REPO" -y --cleanup-tag || true
          gh release create "$TAG" -R "$REPO" --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "AeroResearch GCS 설치 파일. Windows: Developer = 개발자용(기체 설정·파라미터 포함), User = 사용자용(파라미터 수정 불가). 로그인 없이 아래 Assets에서 바로 받을 수 있습니다." \
            out/*
