name: AeroResearch GCS Release

on:
  push:
    branches:
      - 'publish-aero'
  workflow_dispatch:   # GitHub currently skips push-triggered runs on this fork; run it by hand
    inputs:
      variant:
        description: 'Release variant: normal, or FFmpeg (Windows build made with video_player=FFmpeg)'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - FFmpeg

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ inputs.variant == 'FFmpeg' && 'aerogcs-1.6.19-ffmpeg' || 'aerogcs-1.6.19' }}
      SUFFIX: ${{ inputs.variant == 'FFmpeg' && '-FFmpeg' || '' }}
      TITLE: ${{ inputs.variant == 'FFmpeg' && 'AeroResearch GCS 1.6.19 (FFmpeg 영상 시험판)' || 'AeroResearch GCS 1.6.19' }}
    steps:
      - name: Download build artifacts (newest successful aero-gcs build)
        run: |
          set -euo pipefail
          mkdir -p dl out
          # Newest successful build of aero-gcs (docs-only [skip ci] commits have no build, so do not
          # require the branch head itself). Normal builds come from pushes; the FFmpeg test build is
          # a manual (workflow_dispatch) run.
          fetch() {  # workflow, artifact, dir, [commit sha to match]
            ev=$([ -n "$SUFFIX" ] && echo workflow_dispatch || echo push)
            if [ -n "${4:-}" ]; then
              run=$(gh run list -R "$REPO" -c "$4" -w "$1" -s success -L 1 --json databaseId -q '.[0].databaseId')
            else
              run=$(gh run list -R "$REPO" -b aero-gcs -w "$1" -e "$ev" -s success -L 1 --json databaseId -q '.[0].databaseId')
            fi
            if [ -n "$run" ] && gh run download "$run" -R "$REPO" -n "$2" -D "$3"; then
              echo "$1: run $run"
            else
              echo "$1: no successful build found - skipped"
            fi
          }
          fetch Windows QGroundControl-installer-AMD64 dl/win
          fetch Windows QGroundControl-installer-AMD64-User dl/winuser
          # 대영M&S GCS customer edition (QGC_AERO_BRAND=daeyoung)
          fetch Windows QGroundControl-installer-AMD64-Daeyoung dl/dywin
          fetch Windows QGroundControl-installer-AMD64-Daeyoung-User dl/dywinuser
          if [ -z "$SUFFIX" ]; then
            # Android/macOS only when built from the same commit as the Windows build (never stale ones)
            ev=push
            winsha=$(gh run list -R "$REPO" -b aero-gcs -w Windows -e push -s success -L 1 --json headSha -q '.[0].headSha')
            fetch Android QGroundControl-linux dl/android "$winsha"
            fetch MacOS QGroundControl dl/mac "$winsha"
          fi
          find dl -type f -exec ls -l {} \;

      - name: Rename files
        run: |
          set -euo pipefail
          # Developer edition: full vehicle setup / parameters. User edition: operators, no parameter editing
          win=$(find dl -path 'dl/win/*' -iname '*.exe' | head -1)
          winuser=$(find dl -path 'dl/winuser/*' -iname '*.exe' | head -1)
          if [ -n "$win" ]; then
            if [ -n "$winuser" ]; then
              cp "$win" "out/AeroResearchGCS-1.6.19-Windows-x64${SUFFIX}-Developer-Setup.exe"
            else
              cp "$win" "out/AeroResearchGCS-1.6.19-Windows-x64${SUFFIX}-Setup.exe"
            fi
          fi
          [ -n "$winuser" ] && cp "$winuser" "out/AeroResearchGCS-1.6.19-Windows-x64${SUFFIX}-User-Setup.exe"
          dywin=$(find dl -path 'dl/dywin/*' -iname '*.exe' | head -1)
          dywinuser=$(find dl -path 'dl/dywinuser/*' -iname '*.exe' | head -1)
          if [ -n "$dywin" ]; then cp "$dywin" "out/DaeyoungMS-GCS-1.6.19-Windows-x64${SUFFIX}-Developer-Setup.exe"; fi
          if [ -n "$dywinuser" ]; then cp "$dywinuser" "out/DaeyoungMS-GCS-1.6.19-Windows-x64${SUFFIX}-User-Setup.exe"; fi
          apk=$(find dl -path 'dl/android/*' -iname '*.apk' | head -1)
          [ -n "$apk" ] && cp "$apk" "out/AeroResearchGCS-1.6.19-Android.apk"
          dmg=$(find dl -path 'dl/mac/*' -iname '*.dmg' | head -1)
          [ -n "$dmg" ] && cp "$dmg" "out/AeroResearchGCS-1.6.19-macOS.dmg"
          ls -l out
          [ -n "$(ls out)" ]

      - name: Publish release
        run: |
          set -euo pipefail
          # Release notes come from RELEASE_NOTES.md on this branch (normal variant); fall back to a short line
          if [ -z "$SUFFIX" ] && gh api "repos/$REPO/contents/RELEASE_NOTES.md?ref=${{ github.sha }}" \
               -H "Accept: application/vnd.github.raw" > notes.md 2>/dev/null && [ -s notes.md ]; then
            :
          else
            echo "AeroResearch GCS 설치 파일. Windows: Developer = 개발자용(기체 설정·파라미터 포함), User = 사용자용(파라미터 수정 불가). 로그인 없이 아래 Assets에서 바로 받을 수 있습니다." > notes.md
          fi
          gh release delete "$TAG" -R "$REPO" -y --cleanup-tag || true
          gh release create "$TAG" -R "$REPO" --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes-file notes.md \
            out/*
